[package]
name = "deadly-descent"
version = "0.1.0"
edition = "2024"
description = "deadly-descent - a repame + repose arcade template for Poki and other web portals"
repository = "https://github.com/mlm-games/deadly-descent"
keywords = ["gamedev", "game", "2d", "repose", "repame"]
categories = ["game-development"]
rust-version = "1.98"
default-run = "deadly-descent"

[lib]
name = "deadly_descent"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "deadly-descent"
path = "src/main.rs"

[dependencies]
# Engine, from crates.io: the published line is the source of truth, so every
# renderer-state crate unifies to one copy in one binary.
repame-sim = "0.3.34"
repame-shell = "0.3.34"
repame-audio = { version = "0.3.34", features = ["symphonia-ogg-vorbis"] }
repame-view2d = "0.3.34"
repame-view3d = "0.3.34"
image = { version = "0.25", default-features = false, features = ["png"] }
repame-save = "0.3.34"
# Direct dep: bevy derive macros expand to `bevy_ecs::` paths, so every game
# crate names it explicitly. Must unify with repame-sim's 0.20.
bevy_ecs = "0.20"
# Same glam as repame: shared math types must unify to one version.
glam = "0.33"
repose-core = "0.31"
repose-app = "0.31"
repose-render-wgpu = "0.31"
repose-ui = "0.31"
repose-text = "0.31"
# The lifecycle listener (foreground/background) the shell needs to mute on
# mobile.
repose-platform = "0.31"
# Cloud save, high score merge, and the wasm localStorage shim.
game-utils = "0.4"
# Playgama bridge: Poki, CrazyGames, Y8, GameDistribution et al. behind one API,
# plus offline stand-ins so desktop builds need no cfg soup.
playgama-bridge = "0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"
web-time = "1"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
env_logger = "0.11"

[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# rand's callers span three semver-incompatible lines; each needs its own
# wasm randomness backend or the linker drops the shims.
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { version = "0.3", features = ["wasm_js"], package = "getrandom" }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
codegen-units = 1
lto = "thin"

[profile.web-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
